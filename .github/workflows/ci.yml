name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The script is plain ESM and the tests run it directly, so the lane needs
        # a Node with native type stripping and no build step.
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # There are no dependencies to install: the script imports node builtins only.
      - name: Test
        run: npm test
